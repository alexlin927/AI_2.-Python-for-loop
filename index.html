<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Python 條件判斷、串列與 for 迴圈｜國立臺灣師範大學</title>
<style>
:root{color-scheme:light;--navy:#173b72;--bg:#edf2f9;--surface:#fff;--ink:#142b48;--line:#c8d6e9}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif;color:var(--ink)}header{padding:12px 24px;background:linear-gradient(105deg,#123c7a,#2870bc);color:white;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:clamp(16px,2vw,22px);margin:0;font-weight:700}header small{font-size:12px;color:#dce9fb}button{font:inherit;cursor:pointer;border:1px solid var(--line);padding:9px 15px;border-radius:9px;background:white;color:var(--navy);font-weight:650}button:hover,button:focus-visible{background:#dceaff}button:disabled{opacity:.45;cursor:default}button.primary{background:#1d5fbd;border-color:#1d5fbd;color:white}button.primary:hover{background:#123f87}.wrap{max-width:1480px;margin:0 auto;padding:18px 24px 30px}.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:14px}.page-label{font-weight:750;margin:0 9px;font-variant-numeric:tabular-nums}.spacer{flex:1}.slide-frame{width:100%;aspect-ratio:16/9;background:#fff;box-shadow:0 7px 23px #142d5124;border:1px solid #bfd0e6;border-radius:4px;overflow:hidden;display:grid;place-items:center}.slide-frame img{width:100%;height:100%;object-fit:contain;display:block}.notes{margin-top:18px;background:white;border:1px solid var(--line);border-radius:12px;padding:18px 22px;box-shadow:0 2px 10px #1a3e5a10}.notes h2{font-size:19px;margin:0 0 12px;color:#1d4e93}.notes p{white-space:pre-wrap;line-height:1.95;font-size:17px;margin:0}.notes[hidden],.overview[hidden]{display:none!important}.overview{margin-top:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}.thumb{cursor:pointer;background:white;border:2px solid transparent;border-radius:9px;overflow:hidden;padding:5px;box-shadow:0 2px 8px #102c481c;text-align:left}.thumb:hover,.thumb.active{border-color:#2870bc}.thumb img{width:100%;aspect-ratio:16/9;object-fit:contain}.thumb span{display:block;font-size:13px;padding:4px 6px}footer{text-align:center;color:#65748b;font-size:12px;padding:4px 0 22px}.muted{color:#5f7188}body.full header,body.full .toolbar,body.full .notes,body.full footer{display:none!important}body.full{background:#111}body.full .wrap{max-width:none;padding:0;min-height:100vh;display:grid;place-items:center}body.full .slide-frame{width:min(100vw,177.7778vh);height:auto;border:0;border-radius:0;box-shadow:none}body.full .overview{display:none!important}@media(max-width:650px){.wrap{padding:12px 8px}header{padding:12px}.toolbar{gap:5px}button{padding:8px 10px;font-size:13px}.notes{padding:13px}.notes p{font-size:15px}}
</style></head><body>
<header><div><h1>Python 入門｜條件判斷、串列與 for 迴圈</h1><small>國立臺灣師範大學｜化學系名譽教授 林震煌</small></div><small>16:9 教學網頁 · 共 47 頁</small></header>
<main class="wrap"><nav class="toolbar" aria-label="投影片操作"><button id="prev">← 上一頁</button><span class="page-label" id="counter">1 / 47</span><button id="next" class="primary">下一頁 →</button><div class="spacer"></div><button id="toggleNotes" aria-expanded="false">顯示講稿</button><button id="toggleOverview" aria-expanded="false">頁面總覽</button><button id="fullscreen">全螢幕</button></nav>
<div class="slide-frame" id="slideFrame"><img id="image" src="" alt="投影片第 1 頁"></div>
<section id="notes" class="notes" hidden><h2 id="notesTitle">第 1 頁｜教師講稿</h2><p id="notesText"></p></section><section id="overview" class="overview" hidden></section></main>
<footer>使用鍵盤 ← → 翻頁 · Home / End 跳至首末頁 · Esc 離開全螢幕 · 可分享 GitHub Pages 網址</footer>
<script src="data.js"></script><script>
(()=>{'use strict';const S=window.SLIDES||[];let i=0,showNotes=false,showOverview=false;const $=id=>document.getElementById(id);const img=$('image'),counter=$('counter'),notes=$('notes'),overview=$('overview');const updateHash=()=>{history.replaceState(null,'','#'+(i+1));};function go(n){i=Math.max(0,Math.min(S.length-1,n));let s=S[i];img.src=s.image;img.alt='第 '+s.no+' 頁投影片';counter.textContent=s.no+' / '+S.length;$('notesTitle').textContent='第 '+s.no+' 頁｜教師講稿';$('notesText').textContent=s.notes||'本頁未附講稿';$('prev').disabled=i===0;$('next').disabled=i===S.length-1;for(const c of overview.children)c.classList.toggle('active',Number(c.dataset.index)===i);updateHash();}function build(){S.forEach((s,n)=>{let b=document.createElement('button');b.className='thumb';b.dataset.index=n;b.setAttribute('aria-label','跳至第 '+(n+1)+' 頁');let pic=document.createElement('img');pic.loading='lazy';pic.src=s.image;pic.alt='';let title=document.createElement('span');title.textContent='第 '+(n+1)+' 頁';b.append(pic,title);b.onclick=()=>{go(n);overview.hidden=true;showOverview=false;$('toggleOverview').setAttribute('aria-expanded','false');scrollTo({top:0,behavior:'smooth'});};overview.append(b);});}function full(){if(!document.fullscreenElement){document.documentElement.requestFullscreen?.();document.body.classList.add('full');}else document.exitFullscreen?.();}document.addEventListener('fullscreenchange',()=>document.body.classList.toggle('full',!!document.fullscreenElement));$('prev').onclick=()=>go(i-1);$('next').onclick=()=>go(i+1);$('toggleNotes').onclick=()=>{showNotes=!showNotes;notes.hidden=!showNotes;$('toggleNotes').textContent=showNotes?'隱藏講稿':'顯示講稿';$('toggleNotes').setAttribute('aria-expanded',String(showNotes));};$('toggleOverview').onclick=()=>{showOverview=!showOverview;overview.hidden=!showOverview;$('toggleOverview').setAttribute('aria-expanded',String(showOverview));};$('fullscreen').onclick=full;document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select'))return;if(e.key==='ArrowRight'||e.key==='PageDown'){e.preventDefault();go(i+1);}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(i-1);}if(e.key==='Home')go(0);if(e.key==='End')go(S.length-1);if(e.key==='Escape'&&document.body.classList.contains('full')&&!document.fullscreenElement)document.body.classList.remove('full');});window.addEventListener('hashchange',()=>{let n=Number(location.hash.slice(1));if(n>=1&&n<=S.length)go(n-1);});build();let n=Number(location.hash.slice(1));go(n>=1&&n<=S.length?n-1:0);})();
</script></body></html>
